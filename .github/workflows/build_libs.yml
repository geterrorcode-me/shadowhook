name: Build Shadowhook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android Components
        run: |
          # Install CMake 3.22.1 (Versi stabil yang didukung Android)
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      - name: Fix CMake Version in Gradle Files
        # Langkah krusial: Mencari string '4.0.3' dan menggantinya ke '3.22.1' 
        # di semua file build.gradle agar tidak terjadi error CXX1300.
        run: |
          find . -name "build.gradle" -exec sed -i 's/"4.0.3"/"3.22.1"/g' {} +
          find . -name "build.gradle" -exec sed -i "s/'4.0.3'/'3.22.1'/g" {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shadowhook
        run: |
          ./gradlew :shadowhook:assembleRelease \
            -PbuildToolsVersion="33.0.2" \
            -PcompileSdkVersion=33 \
            -PminSdkVersion=16 \
            -PtargetSdkVersion=33 \
            -Pandroid.cmakeVersion="3.22.1"

      - name: Upload SO Libraries
        uses: actions/upload-artifact@v4
        with:
          name: libshadowhook-so
          path: "**/build/intermediates/cmake/release/obj/**/*.so"
