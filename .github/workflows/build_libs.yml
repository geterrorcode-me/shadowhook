name: Build ShadowHook Binaries

on:
  workflow_dispatch: # Agar bisa dijalankan manual klik tombol

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'terminurin'

      - name: Install NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :shadowhook:assembleRelease

      - name: Organize Artifacts
        run: |
          mkdir -p output/libs
          # Mencari semua file .so hasil build
          find shadowhook/build/intermediates/cmake/release -name "*.so" -exec cp --parents {} output/libs/ \;
          # Sederhanakan struktur folder
          mkdir -p final_libs/arm64-v8a
          find output/libs -name "libshadowhook.so" | grep "arm64-v8a" | xargs -I{} cp {} final_libs/arm64-v8a/
          # Ambil juga header filenya
          cp shadowhook/src/main/cpp/shadowhook.h final_libs/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: shadowhook-binaries
          path: final_libs/
          
