name: Build Shadowhook

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android Components
        run: |
          # Install NDK & Build Tools yang diperlukan
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Latest CMake (v3.30.5+)
        # Kita mendownload binari resmi CMake karena sdkmanager tidak punya versi 3.30+
        run: |
          CMAKE_VERSION=3.30.5
          wget https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh
          sudo sh cmake-${CMAKE_VERSION}-linux-x86_64.sh --skip-license --prefix=/usr/local
          # Verifikasi versi
          cmake --version

      - name: Fix CMake Version Reference in Gradle
        # Memastikan Gradle tidak memaksa versi 4.0.3 yang tidak ada, 
        # melainkan menggunakan versi yang baru kita instal di atas.
        run: |
          find . -name "build.gradle" -exec sed -i 's/"4.0.3"/"3.30.5"/g' {} +
          find . -name "build.gradle" -exec sed -i "s/'4.0.3'/'3.30.5'/g" {} +

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shadowhook
        run: |
          # Kita gunakan -Pandroid.cmake_dir untuk memberi tahu Gradle lokasi CMake manual kita
          ./gradlew :shadowhook:assembleRelease \
            -PbuildToolsVersion="33.0.2" \
            -PcompileSdkVersion=33 \
            -PminSdkVersion=16 \
            -PtargetSdkVersion=33 \
            -Pandroid.cmakeVersion="3.30.5"

      - name: Upload SO Libraries
        uses: actions/upload-artifact@v4
        with:
          name: libshadowhook-so
          path: "**/build/intermediates/cmake/release/obj/**/*.so"
