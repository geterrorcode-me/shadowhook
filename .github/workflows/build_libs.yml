name: Build Shadowhook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK & NDK
        # Kita menginstal CMake dan NDK yang dibutuhkan
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.2.9519653" \
            "cmake;3.22.1" \
            "build-tools;33.0.2" \
            "platforms;android-33"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Catatan: Kita memaksa Gradle menggunakan CMake 3.22.1 
        # karena 4.0.3 kemungkinan besar adalah typo di build script atau versi yang belum stabil.
        run: |
          ./gradlew :shadowhook:assembleRelease \
            -Pandroid.extractNativeLibs=true \
            -PbuildToolsVersion="33.0.2" \
            -PcompileSdkVersion=33 \
            -PminSdkVersion=16 \
            -PtargetSdkVersion=33 \
            -Pandroid.cmakeVersion="3.22.1"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libshadowhook-so
          path: |
            **/build/intermediates/cmake/release/obj/**/*.so
            **/build/outputs/aar/*.aar
