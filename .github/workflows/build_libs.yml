name: Build ShadowHook Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK and CMake
        run: |
          # Install NDK r25b dan CMake 3.22.1
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Patch Project (Brute Force Overwrite)
        run: |
          # 1. Timpa build.gradle root untuk menggunakan repositori & AGP stabil
          cat <<EOF > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. Modifikasi settings.gradle: HANYA modul library
          echo "include ':shadowhook'" > settings.gradle

          # 3. Patch build.gradle di dalam folder shadowhook
          # Mengatur agar tidak ada konflik versi NDK
          find shadowhook -name "build.gradle" -exec sed -i 's/ndkVersion [^ ]*/ndkVersion "25.1.8937393"/g' {} +
          
          # 4. Patch CMakeLists.txt: Turunkan syarat versi minimum
          find shadowhook -name "CMakeLists.txt" -exec sed -i 's/cmake_minimum_required(VERSION [0-9.]*)/cmake_minimum_required(VERSION 3.10.2)/g' {} +
          
          # 5. Lock jalur SDK/NDK/CMake di local.properties
          # Menggunakan backslash (\$) agar shell tidak mengevaluasi variabel sebelum ditulis ke file
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
          
          chmod +x gradlew

      - name: Build ShadowHook Library
        run: |
          # Jalankan assembleRelease hanya untuk modul :shadowhook
          ./gradlew :shadowhook:assembleRelease \
            -Pandroid.ndkVersion=25.1.8937393 \
            -Dorg.gradle.project.android.externalNativeBuild.cmake.version=3.22.1 \
            --no-daemon --stacktrace --info

      - name: Organize Artifacts
        run: |
          mkdir -p final_libs/arm64-v8a
          mkdir -p final_libs/include
          
          # Ambil .so hasil kompilasi
          find shadowhook/build/intermediates/cmake/release -name "libshadowhook.so" | grep "arm64-v8a" | xargs -I{} cp {} final_libs/arm64-v8a/
          
          # Ambil header file shadowhook.h
          find shadowhook/src/main/cpp -name "shadowhook.h" -exec cp {} final_libs/include/ \;

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: shadowhook-binaries
          path: final_libs/
          retention-days: 7
