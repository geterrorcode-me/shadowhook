name: Build Shadowhook

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Penting jika shadowhook menggunakan submodule

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      # Langkah ini untuk memastikan NDK tersedia karena Shadowhook adalah library C/C++
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # Kita menyuntikkan properti yang hilang melalui flag -P
        # Sesuaikan versi di bawah ini dengan kebutuhan proyek Anda
        run: |
          ./gradlew :shadowhook:assembleRelease \
            -PbuildToolsVersion="33.0.2" \
            -PcompileSdkVersion=33 \
            -PminSdkVersion=16 \
            -PtargetSdkVersion=33

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libshadowhook-so
          path: |
            **/build/intermediates/cmake/release/obj/**/*.so
            **/build/outputs/aar/*.aar
